<!DOCTYPE html>
<html>
<head>
    
    <title>Array Methods</title>
</head>
<body>

    <p id="b"></p>

    <button onclick="pushdata()">Push</button>
    <button onclick="popdata()">Pop</button>
    <button onclick="shiftdata()">Shift</button>
    <button onclick="unshiftdata()">UnShift</button>
    <button onclick="filterdata()">Filter</button>
    <button onclick="mapdata()">Map</button>
    <button onclick="find()">Find</button>

    <script>

        let s = ["Vijay"];

        
        document.getElementById("b").innerHTML = s;

        function pushdata() {
            s.push("Suriya", "Madhavan", "Vikram", "Ajith");
            document.getElementById("b").innerHTML = s;
        }

        function popdata() {
            s.pop();
            document.getElementById("b").innerHTML = s;
        }

        function shiftdata() {
            s.shift();
            document.getElementById("b").innerHTML = s;
        }

        function unshiftdata() {
            s.unshift("Dhuruv");
            document.getElementById("b").innerHTML = s;
        }

        function filterdata() {
            let result = s.filter(obj => obj.startsWith("D"));
            document.getElementById("b").innerHTML = result;
        }

        function mapdata() {
            let result = s.map(obj => obj.toUpperCase());
            document.getElementById("b").innerHTML = result;
        }
        function find() {
            let result = s.find(obj => obj=="Vikram");
            document.getElementById("b").innerHTML = result;
        }
