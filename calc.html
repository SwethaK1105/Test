<!DOCTYPE html>
<html>
    <head>
        <title>Task</title>
    </head>
    <body style="background-color: aqua;">
        <div style="text-align: center;">
        <h1 style="text-decoration: underline;">Calculation</h1>
        <label>number1:</label>
        <input type="number" id="a"><br><br>
        <label>number2:</label>
        <input type="number" id="b"><br><br>
        <button onclick="btn()">Add +</button>
        <button onclick="btn1()">Sub -</button>
        <button onclick="btn2()">Mul *</button>
        <button onclick="btn3()">Div /</button>
        <h2 id="c">Result</h2>
        </div>
        <script>
            function btn(){
                var num1=Number(prompt("Enter the Number 1"))
                var num2=Number(prompt("Enter the number 2"))
                res=num1+num2;
                var num3=document.getElementById("c").innerHTML=res;
            }
             function btn1(){
                var num1=Number(document.getElementById("a").value);
                var num2=Number(document.getElementById("b").value);
                res=num1-num2;
                var num3=document.getElementById("c").innerHTML=res;
            }   
            function btn2(){
                var num1=Number(document.getElementById("a").value);
                var num2=Number(document.getElementById("b").value);
                res=num1*num2;
                var num3=document.getElementById("c").innerHTML=res;
            }
            function btn3(){
                var num1=Number(document.getElementById("a").value);
                var num2=Number(document.getElementById("b").value);
                res=num1/num2;
                var num3=document.getElementById("c").innerHTML=res;
            }        
        </script>
    </body>
</html>
