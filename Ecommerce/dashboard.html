<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <link rel="stylesheet" href="ecom.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Sidebar -->

    <div class="div1">

        <h2 class="h2">Ecommerce</h2>
        <br>

        <div class="q">
            <a href="dashboard.html" class="a">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>
        </div>

        <br>

        <div class="q">
            <a href="Products.html" class="a">
                Products
            </a>
        </div>

        <br>

        <div class="q">
    <a href="Categories.html" class="a">
        Categories
    </a>
</div>

<br>

        <div class="q">
            <a href="Users.html" class="a">
                Users
            </a>
        </div>

        <br>

        <div class="q">
           <a href="#" class="a" onclick="logout()">Logout</a>
        </div>

    </div>

    <!-- Main Content -->

    <div class="main-content">

        <!-- Cards -->

        <div class="cards">

            <div class="card card1">

                <i class="fa-solid fa-box"></i>

                <div>
                    <h3>Products</h3>
                    <p id="productCount">0</p>
                </div>

            </div>

            <div class="card card2">

                <i class="fa-solid fa-user"></i>

                <div>
                    <h3>Users</h3>
                    <p id="userCount">0</p>
                </div>

            </div>

            <div class="card card3">

                <i class="fa-solid fa-cart-shopping"></i>

                <div>
                    <h3>Orders</h3>
                    <p>0</p>
                </div>

            </div>

            <div class="card card4">

                <i class="fa-solid fa-wallet"></i>

                <div>
                    <h3>Total Profit</h3>
                    <p>₹0</p>
                </div>

            </div>

        </div>

        <!-- Content -->

        <div class="content">

            <div class="sales">

                <h2>PRODUCT SALES</h2>

                <br>

                <p>
                    Total Products Available:
                    <strong id="totalProducts">0</strong>
                </p>

            </div>

            <div class="buyers">

                <h2>RECENT USERS</h2>

                <br>

                <div id="recentUsers">

                </div>

            </div>

        </div>

    </div>

<script>

let products =
JSON.parse(localStorage.getItem("products")) || [];

let users =
JSON.parse(localStorage.getItem("users")) || [];

/* Product Count */

document.getElementById("productCount").innerText =
products.length;

document.getElementById("totalProducts").innerText =
products.length;

/* User Count */

document.getElementById("userCount").innerText =
users.length;

/* Recent Users */

let recentUsers =
document.getElementById("recentUsers");

if(users.length === 0){

    recentUsers.innerHTML =
    "<p>No Users Found</p>";
}

else{

    users.slice(-5).reverse().forEach(user=>{

        recentUsers.innerHTML += `
            <p>${user.name}</p>
            <hr>
        `;
    });
}

</script>

</body>
</html>
