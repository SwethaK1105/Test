<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f3f4f7;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:450px;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    background:#2F7CF5;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1f63c9;
}

a{
    text-decoration:none;
}

p{
    text-align:center;
    margin-top:15px;
}

</style>

</head>
<body>

<div class="container">

    <h1>Signup Form</h1>

    <label>Username</label>
    <input type="text" id="username">

    <label>Email</label>
    <input type="email" id="email">

    <label>Password</label>
    <input type="password" id="password">

    <button onclick="signup()">
        Signup
    </button>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script>

function signup(){

    let username =
    document.getElementById("username").value.trim();

    let email =
    document.getElementById("email").value.trim();

    let password =
    document.getElementById("password").value.trim();

    if(
        username === "" ||
        email === "" ||
        password === ""
    ){
        alert("Please fill all fields");
        return;
    }

    let users =
    JSON.parse(localStorage.getItem("signupUsers")) || [];

    let exists = users.find(user =>
        user.username === username ||
        user.email === email
    );

    if(exists){

        alert("Username or Email already exists");

        return;
    }

    users.push({
        username:username,
        email:email,
        password:password
    });

    localStorage.setItem(
        "signupUsers",
        JSON.stringify(users)
    );

    alert("Signup Successful");

    window.location.href = "login.html";
}

</script>

</body>
</html>
