<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <link rel="stylesheet" href="ecom.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- Sidebar -->

    <div class="div1">

        <h2 class="h2">Ecommerce</h2>

        <br>

        <div class="q">
            <a href="dashboard.html" class="a">
                <i class="fa-solid fa-house"></i>
                Dashboard
            </a>
        </div>

        <br>

        <div class="q">
            <a href="Products.html" class="a">
                Products
            </a>
        </div>

        <br>

        <div class="q">
    <a href="Categories.html" class="a">
        Categories
    </a>
</div>

<br>

        <div class="q">
            <a href="Users.html" class="a">
                Users
            </a>
        </div>

        <br>

        <div class="q">
           <a href="#" class="a" onclick="logout()">Logout</a>
        </div>

    </div>

    <!-- Main Area -->

    <div style="flex:1; padding:20px;">

        <button
            class="s1"
            onclick="location.href='addproduct.html'">
            + Add Product
        </button>

        <h1>Products</h1>

        <table>

            <thead>

                <tr>

                    <th>Product Name</th>

                    <th>Category</th>

                    <th>Price</th>

                    <th>Stock</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="x1">

            </tbody>

        </table>

    </div>

<script>

let products =
JSON.parse(localStorage.getItem("products")) || [];

let tbody =
document.getElementById("x1");

displayProducts();

function displayProducts(){

    tbody.innerHTML = "";

    if(products.length === 0){

        tbody.innerHTML = `
        <tr>
            <td colspan="5">
                No Products Available
            </td>
        </tr>
        `;

        return;
    }

    products.forEach((product,index)=>{

        tbody.innerHTML += `

        <tr>

            <td>${product.ProductName}</td>

            <td>${product.Category}</td>

            <td>₹${product.Price}</td>

            <td>${product.Stock}</td>

            <td>

                <button
                onclick="editProduct(${index})">

                    <i class="fa-solid fa-pencil"></i>

                </button>

                <button
                onclick="deleteProduct(${index})">

                    <i class="fa-solid fa-trash"></i>

                </button>

            </td>

        </tr>

        `;
    });
}

function editProduct(index){

    localStorage.setItem(
        "editIndex",
        index
    );

    window.location.href =
    "addproduct.html";
}

function deleteProduct(index){

    let confirmDelete =
    confirm(
        "Are you sure you want to delete this product?"
    );

    if(confirmDelete){

        products.splice(index,1);

        localStorage.setItem(
            "products",
            JSON.stringify(products)
        );

        displayProducts();
    }
}

</script>

</body>
</html>
